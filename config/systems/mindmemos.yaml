# MindMemOS System Configuration for LifeBench_eval

name: "mindmemos"
version: "1.0"
description: "MindMemOS memory system with incremental writes, deduplication, and hybrid search"

adapter: "mindmemos"
builder: "mindmemos"

# MindMemOS API configuration
api_base_url: "${MINDMEMOS_API_BASE_URL:http://127.0.0.1:8000}"
# api_key is auto-generated by the builder and injected via MINDMEMOS_API_KEY env var.
# The key is written to config/mindmemos/api_keys.yaml before the server starts.
api_key: "${MINDMEMOS_API_KEY:dev-api-key-001}"

# Memory algorithm: "vanilla" (flat memories) or "schema" (entity modeling + agentic search).
# The builder generates an API key with the matching memory_algorithm and
# project_override_config so the server enables the correct processing pipeline.
memory_algorithm: "${MINDMEMOS_MEMORY_ALGORITHM:schema}"
timeout: 1800

# Search configuration
search_top_k: 40
# search_strategy: "fast" for vanilla, "agentic" for schema (multi-hop entity search)
search_strategy: "${MINDMEMOS_SEARCH_STRATEGY:agentic}"
rerank: false

# LLM configuration (for answer generation)
llm:
  model: "${LLM_MODEL:deepseek-chat}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://api.deepseek.com/v1}"
  temperature: 0.0
  max_tokens: 32768

# Builder configuration
config_name: "${MINDMEMOS_CONFIG_NAME:dev}"
service_url: "${MINDMEMOS_SERVICE_URL:http://127.0.0.1:8000}"
