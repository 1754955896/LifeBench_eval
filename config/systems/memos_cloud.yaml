# Memos Cloud System Configuration

name: "memos_cloud"
version: "1.0"
description: "Memos Cloud API (memtensor.cn)"

adapter: "memos_cloud"

api_url: "https://memos.memtensor.cn/api/openmem/v1"
api_key: "${MEMOS_API_KEY}"
max_retries: 3
retry_delay: 2.0
timeout: 60.0
rpm: 60

llm:
  model: "${LLM_MODEL}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0
  max_tokens: 32768

search:
  top_k: 40

answer:
  max_retries: 3
