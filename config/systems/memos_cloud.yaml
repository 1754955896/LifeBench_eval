# Memos Cloud System Configuration

name: "memos_cloud"
version: "1.0"
description: "Memos Cloud API (memtensor.cn)"

adapter: "memos_cloud"

api_url: "https://memos.memtensor.cn/api/openmem/v1"
api_key: "your_key"
max_retries: 3
retry_delay: 2.0
timeout: 60.0
rpm: 60

# Tracker 聚合 latency 统计用的结果目录（相对项目根，如 results/lifebench-memos_cloud-omni）。
# 留空则 tracker 跳过 latency 聚合；运行时设置 OUTPUT_DIR 环境变量即可覆盖。
output_dir: "${OUTPUT_DIR}"

llm:
  provider: "openai"
  model: "${LLM_MODEL}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0
  max_tokens: 32768

search:
  top_k: 40

answer:
  max_retries: 3
