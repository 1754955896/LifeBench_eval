# LifeMem System Configuration

name: "lifemem"
version: "1.0"
description: "LifeMem"

adapter: "lifemem"

llm:
  provider: "openai"
  model: "${LLM_MODEL}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0.3
  max_tokens: 32768

answer:
  temperature: 0

add:
  num_workers: 1
  fast: true
  memcell_boundary_mode: "structural"
  enable_clustering: true
  enable_profile_extraction: false
  period_summary:
    enabled: true
    weekly: true
    monthly: true
    inject_into_index: true
    max_concurrent: 4
  memscene:
    enabled: false
    inject_into_index: false
    max_concurrent: 4

search:
  mode: "agentic"
  lightweight_search_mode: "hybrid"
  num_workers: 1
  memscene_retrieval:
    enabled: false
    top_k: 5
    min_score: 0.0

stats:
  enabled: true
  output_filename: token_stats.json
