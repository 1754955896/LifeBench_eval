# TencentDB-Agent-Memory System Configuration

name: "tencentdb"
version: "1.0"
description: "TencentDB-Agent-Memory - Layered memory system with L0-L3 hierarchy"

adapter: "tencentdb"

builder: "tencentdb"

# Builder configuration (used by builder to start memory system)
dockerfile: "systems/TencentDB-Agent-Memory/docker/opensource/Dockerfile.hermes"
image_name: "hermes-memory"
container_name: "hermes-memory"
gateway_port: 8420
docker_wait: 30

# Adapter configuration
host: "http://localhost:8420"
session_key_prefix: "lifebench"
max_retries: 5
retry_delay: 3.0
timeout: 300

# LLM for answer generation
llm:
  provider: "openai"
  model: "${LLM_MODEL:deepseek-v4-flash}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://api.deepseek.com}"
  temperature: 0
  max_tokens: 32768

search:
  top_k: 40
  search_interval: 0.05

answer:
  max_retries: 3

# Memory plugin configuration (passed to Gateway)
# See: systems/TencentDB-Agent-Memory/src/config.ts for full options
memory:
  # Storage backend: sqlite (default) or tcvdb (Tencent Cloud VectorDB)
  storeBackend: "sqlite"

  # Recall settings
  recall:
    enabled: true
    maxResults: 5
    strategy: "hybrid"  # "embedding" | "keyword" | "hybrid" (RRF fusion, recommended)
    scoreThreshold: 0.3
    timeoutMs: 5000

  # Embedding configuration (for vector search)
  # Set provider to "none" to disable vector search (use keyword only)
  embedding:
    enabled: true
    provider: "openai"  # OpenAI-compatible provider
    baseUrl: "${VECTORIZE_BASE_URL:https://api.siliconflow.cn/v1}"
    apiKey: "${VECTORIZE_API_KEY}"
    model: "${VECTORIZE_MODEL:Qwen/Qwen3-Embedding-4B}"
    dimensions: ${VECTORIZE_DIMENSIONS:1024}
    sendDimensions: true  # Set false for BGE-M3 or similar models that reject custom dimensions

  # BM25 keyword search (always enabled, used in hybrid mode)
  bm25:
    enabled: true
    language: "zh"  # "zh" or "en"

  # Capture settings
  capture:
    enabled: true
    excludeAgents: []
    l0l1RetentionDays: 0  # 0 = never cleanup

  # Extraction settings (L1 memory extraction)
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20

  # Pipeline trigger settings
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600

  # Persona settings (L2/L3)
  persona:
    triggerEveryN: 50
    maxScenes: 15

  # Standalone LLM override (uses direct API instead of host LLM)
  llm:
    enabled: false  # Set true to use separate LLM for memory extraction
    baseUrl: "${LLM_BASE_URL:https://api.deepseek.com}"
    apiKey: "${LLM_API_KEY}"
    model: "${LLM_MODEL:deepseek-chat}"
    maxTokens: 4096
    timeoutMs: 120000

  # Context offload (short-term memory compression)
  offload:
    enabled: false
