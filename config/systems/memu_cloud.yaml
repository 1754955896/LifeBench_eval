# memU Cloud System Configuration
name: "memu_cloud"
version: "1.0"
description: "memU Cloud API (memu.so)"

adapter: "memu_cloud"

# memU 云服务地址
api_url: "https://api.memu.so"
api_key: "your_key"
max_retries: 3
retry_delay: 2.0
timeout: 60.0

# Tracker 聚合 latency 统计用的结果目录（相对项目根，如 results/lifebench-memu_cloud-nollm）。
# 留空则 tracker 跳过 latency 聚合；运行时设置 OUTPUT_DIR 环境变量即可覆盖。
output_dir: "${OUTPUT_DIR}"

# Answer 阶段所需的 LLM（用于根据检索到的记忆生成最终答案，与 memU 存储无关）
llm:
  provider: "openai"
  model: "${LLM_MODEL}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0
  max_tokens: 32768
  
search:
  top_k: 40

answer:
  max_retries: 3
