# memU-server System Configuration

name: "memu_server"
version: "1.0"
description: "memU-server (Docker) - local memory system via FastAPI"

adapter: "memu_server"
builder: "memu_server"

# Builder configuration
docker_compose: "systems/memU-server/docker-compose.yml"
docker_wait: 15

# Adapter configuration
host: "http://localhost:8000"
timeout: 120
max_retries: 3

# LLM config (used by builder to generate .env)
llm:
  model: "${LLM_MODEL:deepseek-v4-flash}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://api.deepseek.com}"
  temperature: 0
  max_tokens: 32768

search:
  top_k: 40
