# LoCoMo Dataset Configuration
# Original LoCoMo format - pure conversation format

name: "locomo"
version: "1.0"
description: "LoCoMo original format, 10 persons / ~350 QA"

# Memory language setting
memory_language: "en"

# Data configuration
data:
  path: "../datasets/locomo/locomo10.json"
  format: "locomo"

# Evaluation configuration
evaluation:
  type: "llm_judge"
  llm:
    provider: "openai"
    model: "${LLM_MODEL}"
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  num_runs: 3
