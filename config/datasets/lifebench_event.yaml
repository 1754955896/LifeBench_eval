# LifeBench Event Dataset Configuration
# Single person (sunyuwei) event-granularity source: daily sessions replaced by event records

name: "lifebench_event"
version: "1.0"
description: "LifeBench event-granularity source, 1 person / 328 QA / 5716 event records"

# Memory language setting
memory_language: "zh"

# Data configuration
data:
  path: "../datasets/lifebench_event_scource/lifebench_event.json"
  format: "lifebench"

# Evaluation configuration
evaluation:
  type: "llm_judge"
  llm:
    model: "${LLM_MODEL}"
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  num_runs: 1