# LifeBench Sparse Dataset Configuration
# Three persons (sunyuwei/yuxiaowei/fenghaoran) sparse subset: evidence + distractors sampled uniformly across 12 months

name: "lifebench_sparse"
version: "1.0"
description: "LifeBench sparse subset, 3 persons / 453 QA, distractors sampled uniformly across 01~12"

# Memory language setting
memory_language: "zh"

# Data configuration
data:
  path: "../datasets/lifebench_dense/lifebench_sparse.json"
  format: "lifebench"

# Evaluation configuration
evaluation:
  type: "llm_judge"
  llm:
    model: "${LLM_MODEL}"
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  num_runs: 1