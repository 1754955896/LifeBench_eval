# LifeBench Locomo 1 Person Dataset Configuration
# Single person subset (sunyuwei) from lifebench_locomo_format

name: "lifebench_locomo_1people"
version: "1.0"
description: "Single person subset (sunyuwei) of lifebench_locomo_format, 1 person / 328 QA"

# Memory language setting
memory_language: "zh"

# Data configuration
data:
  path: "../datasets/lifebench_locomo_format/lifebench_locomo_1people.json"
  format: "lifebench"

# Evaluation configuration
evaluation:
  type: "llm_judge"
  llm:
    provider: "openai"
    model: "${LLM_MODEL}"
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  num_runs: 1